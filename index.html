<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Визитка — Шерали Шерказиев</title>
<style>
:root{--bg1:#0a0805;--bg2:#1d1608;--card:rgba(255,215,120,.06);--bd:rgba(212,175,55,.28);--tx:#f6efe0;--mu:#b5a784;--ac:#e6c35c;--ac2:#b8860b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{min-height:100%;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px 16px;overflow-x:hidden;position:relative}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.3;z-index:0;animation:float 14s ease-in-out infinite}
.b1{width:300px;height:300px;background:var(--ac);top:-80px;left:-80px}
.b2{width:340px;height:340px;background:var(--ac2);bottom:-100px;right:-100px;animation-delay:-6s}
@keyframes float{50%{transform:translate(40px,50px) scale(1.15)}}
.card{position:relative;z-index:1;width:100%;max-width:400px;background:var(--card);border:1px solid var(--bd);border-radius:28px;padding:32px 22px 24px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .8s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.94)}}
.ph{position:relative;width:132px;height:132px;margin:0 auto 18px}
.ph::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--ac),var(--ac2),var(--ac));animation:spin 5s linear infinite}
.ph::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--ac);animation:pulse 2.4s ease-out infinite}
.ph img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;border-radius:50%;border:4px solid var(--bg1)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{to{transform:scale(1.35);opacity:0}}
h1{font-size:1.6rem;letter-spacing:.3px;background:linear-gradient(100deg,#b8860b 0%,#fff1b8 30%,#e6c35c 50%,#fff1b8 70%,#b8860b 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 4s linear infinite}@keyframes shine{to{background-position:-250% 0}}
.role{color:var(--mu);margin-top:4px;font-size:.95rem}
.list{margin-top:22px;display:grid;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:16px;background:var(--card);border:1px solid var(--bd);color:var(--tx);text-decoration:none;text-align:left;font-size:.96rem;transition:transform .2s,border-color .2s;opacity:0;animation:up .6s ease forwards;-webkit-tap-highlight-color:transparent}
.item:nth-child(1){animation-delay:.5s}.item:nth-child(2){animation-delay:.62s}.item:nth-child(3){animation-delay:.74s}.item:nth-child(4){animation-delay:.86s}.item:nth-child(5){animation-delay:.98s}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.item:hover,.item:active{transform:translateY(-3px) scale(1.02);border-color:var(--ac)}
.ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#f5dc8a,#c99a2e);color:#1a1206}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic .f{fill:currentColor;stroke:none}
.item small{display:block;color:var(--mu);font-size:.74rem;margin-bottom:1px}
.item span{word-break:break-word}
@media (max-width:380px){.card{padding:26px 16px 18px}h1{font-size:1.4rem}.item{padding:11px 12px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style></head><body>
